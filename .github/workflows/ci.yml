name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: creatormatch, POSTGRES_PASSWORD: creatormatch, POSTGRES_DB: cm_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U creatormatch" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt ruff
      - run: ruff check app tests --select E9,F63,F7,F82
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Tests on PostgreSQL + pgvector
        run: python -m pytest -q
        env: { TEST_DATABASE_URL: "postgresql://creatormatch:creatormatch@localhost:5432/cm_test" }
      - name: Migrations apply cleanly
        run: alembic upgrade head
        env: { DATABASE_URL: "postgresql://creatormatch:creatormatch@localhost:5432/cm_test" }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
        env: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
